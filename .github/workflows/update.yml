name: Update snow report

on:
  schedule:
    - cron: "17 10 * * *"   # daily ~5:17am Eastern (10:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "docs/widget.js", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: snow-report
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build snow.json
        run: node src/update.ts && node src/probe.ts
      - name: Commit if changed
        run: |
          git config user.name "snow-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Snow report $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
